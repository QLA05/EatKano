<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, target-densitydpi=device-dpi">
    <title>吃掉小鹿乃</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f0f8ff;
            font-family: "Microsoft YaHei", sans-serif;
            overflow: hidden;
        }

        /* 游戏主区域 */
        #game-area {
            position: relative;
            width: 500px;
            height: 500px;
            background: #d6eaf8;
            border: 2px solid #aed6f1;
            /* 网格背景 */
            background-image: 
                linear-gradient(#aed6f1 1px, transparent 1px),
                linear-gradient(90deg, #aed6f1 1px, transparent 1px);
            background-size: calc(100% / 3) calc(100% / 3);
        }

        /* 时间显示 */
        #time-text {
            position: absolute;
            top: -80px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 60px;
            font-weight: bold;
            color: #e74c3c;
            opacity: 0.8;
            z-index: 10;
        }

        /* 小鹿乃角色 */
        .kano {
            position: absolute;
            width: 100px;
            height: 100px;
            cursor: pointer;
            transition: transform 0.1s;
            z-index: 5;
        }
        .kano:active {
            transform: scale(0.9);
        }
        .kano img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* 结算弹窗 - 默认隐藏 */
        #result-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(214, 234, 248, 0.95);
            display: none; /* 核心：默认不显示 */
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            z-index: 20;
        }
        #result-modal.show {
            display: flex;
        }

        .result-text {
            font-size: 32px;
            font-weight: bold;
            color: #000;
        }

        /* 按钮样式 */
        .btn {
            width: 320px;
            height: 55px;
            background: #5d6d7e;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 22px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #4a5568;
        }
        .btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div id="game-area">
        <div id="time-text">TIME:20</div>

        <!-- 小鹿乃角色（示例，你可以替换成自己的图片路径） -->
        <div class="kano" id="kano">
            <img src="kano.png" alt="小鹿乃">
        </div>

        <!-- 结算弹窗 -->
        <div id="result-modal">
            <div class="result-text">CPS</div>
            <div class="result-text" id="final-score">得分: 0</div>
            <div class="result-text" id="best-score">最佳: 0</div>
            
            <button class="btn" id="restart-btn">重来</button>
            <button class="btn" id="home-btn">主页</button>
            <button class="btn" id="repo-btn">仓库</button>
        </div>
    </div>

    <script>
        // ========== 游戏核心变量 ==========
        const gameArea = document.getElementById('game-area');
        const timeText = document.getElementById('time-text');
        const kano = document.getElementById('kano');
        const resultModal = document.getElementById('result-modal');
        const finalScoreText = document.getElementById('final-score');
        const bestScoreText = document.getElementById('best-score');
        const restartBtn = document.getElementById('restart-btn');
        const homeBtn = document.getElementById('home-btn');
        const repoBtn = document.getElementById('repo-btn');

        let timeLeft = 20;       // 倒计时时长
        let score = 0;           // 当前得分
        let bestScore = localStorage.getItem('eatKano_best') || 0; // 最佳分本地存储
        let isGameOver = false;  // 游戏结束状态
        let timer = null;        // 定时器

        // 初始化最佳分显示
        bestScoreText.textContent = `最佳: ${bestScore}`;

        // ========== 游戏初始化 ==========
        function initGame() {
            // 重置所有状态
            timeLeft = 20;
            score = 0;
            isGameOver = false;
            timeText.textContent = `TIME:${timeLeft}`;
            
            // 隐藏结算弹窗（核心修复点）
            resultModal.classList.remove('show');
            
            // 随机生成小鹿乃位置
            randomKanoPosition();
            
            // 启动倒计时
            startTimer();
        }

        // ========== 倒计时逻辑 ==========
        function startTimer() {
            // 先清除之前的定时器，防止叠加
            if (timer) clearInterval(timer);
            
            timer = setInterval(() => {
                timeLeft--;
                timeText.textContent = `TIME:${timeLeft}`;
                
                if (timeLeft <= 0) {
                    gameOver();
                }
            }, 1000);
        }

        // ========== 游戏结束 ==========
        function gameOver() {
            clearInterval(timer);
            isGameOver = true;
            
            // 更新最佳分
            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem('eatKano_best', bestScore);
            }
            
            // 更新结算面板文字
            finalScoreText.textContent = `得分: ${score}`;
            bestScoreText.textContent = `最佳: ${bestScore}`;
            
            // 显示结算弹窗
            resultModal.classList.add('show');
        }

        // ========== 随机小鹿乃位置 ==========
        function randomKanoPosition() {
            const areaWidth = gameArea.clientWidth - kano.offsetWidth;
            const areaHeight = gameArea.clientHeight - kano.offsetHeight;
            
            const randomX = Math.floor(Math.random() * areaWidth);
            const randomY = Math.floor(Math.random() * areaHeight);
            
            kano.style.left = randomX + 'px';
            kano.style.top = randomY + 'px';
        }

        // ========== 点击小鹿乃加分 ==========
        kano.addEventListener('click', () => {
            if (isGameOver) return; // 游戏结束后点击无效
            score++;
            randomKanoPosition();
        });

        // ========== 核心修复：重来按钮绑定事件 ==========
        restartBtn.addEventListener('click', () => {
            initGame(); // 重新初始化游戏，自动隐藏弹窗
        });

        // 主页按钮（示例跳转，可自行修改地址）
        homeBtn.addEventListener('click', () => {
            window.location.href = '/';
        });

        // 仓库按钮（跳转到你的GitHub仓库）
        repoBtn.addEventListener('click', () => {
            window.open('https://github.com/qla05/EatKano', '_blank');
        });

        // ========== 页面加载完成后启动游戏 ==========
        window.onload = () => {
            initGame();
        };
    </script>
</body>
</html>
